<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JLPT N5 ও N4 কানজি ফ্ল্যাশকার্ড</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7ff;--fg:#1f2a44;--muted:#6b7280;--panel:#fff;--line:#e3e7f3;--on:#d6336c;--kun:#1c7ed6;--n5:#ff7a59;--n5b:#ffb347;--n4:#2f80ed;--n4b:#7c5cff;--ok:#12b886}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151f;--fg:#eef1fb;--muted:#9aa3b8;--panel:#1c2030;--line:#2b3148;--on:#ff7da8;--kun:#74b9ff}}
:root[data-theme="dark"]{--bg:#12151f;--fg:#eef1fb;--muted:#9aa3b8;--panel:#1c2030;--line:#2b3148;--on:#ff7da8;--kun:#74b9ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{min-height:100vh;background:var(--bg);color:var(--fg);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic","Noto Sans Bengali","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:520px;padding:14px 14px 22px}
h1{font-size:1.15rem;text-align:center;margin:6px 0 12px;background:linear-gradient(90deg,var(--n5),var(--n4b));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800}
.tabs,.tools{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-bottom:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 14px;font-size:.85rem;transition:transform .15s,background .2s}
button:active{transform:scale(.94)}
.tab.on{color:#fff;border-color:transparent;font-weight:700}
.tab[data-d="N5"].on{background:linear-gradient(90deg,var(--n5),var(--n5b))}
.tab[data-d="N4"].on{background:linear-gradient(90deg,var(--n4),var(--n4b))}
.tab[data-d="ALL"].on{background:linear-gradient(90deg,var(--ok),#51cf66)}
.tool.on{border-color:var(--ok);color:var(--ok);font-weight:700}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 2px 4px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#51cf66);transition:width .5s}
.stat{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted);margin:0 3px 10px}
.stage{perspective:1100px;height:min(58vh,400px);min-height:300px}
.card{position:relative;width:100%;height:100%;cursor:pointer;animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.card.out{animation:out .25s ease-in forwards}
.card.outl{animation:outl .25s ease-in forwards}
@keyframes pop{from{opacity:0;transform:translateY(24px) scale(.92)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(90px) rotate(8deg)}}
@keyframes outl{to{opacity:0;transform:translateX(-90px) rotate(-8deg)}}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.4,.2,.2,1)}
.card.flip .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:26px;background:var(--panel);border:2px solid var(--line);box-shadow:0 8px 28px rgba(60,70,130,.15);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;overflow:hidden}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:9px;background:var(--g)}
.back{transform:rotateY(180deg)}
.lvl{position:absolute;top:18px;left:18px;font-size:.72rem;font-weight:800;color:#fff;padding:3px 10px;border-radius:99px;background:var(--g)}
.no{position:absolute;top:18px;right:18px;font-size:.75rem;color:var(--muted)}
.k{font-size:min(36vw,170px);line-height:1.1;font-weight:700;color:var(--c)}
.hint{position:absolute;bottom:16px;font-size:.78rem;color:var(--muted);animation:blink 1.8s infinite}
@keyframes blink{50%{opacity:.35}}
.kk{font-size:3.2rem;font-weight:700;color:var(--c);line-height:1}
.mean{font-size:1.5rem;font-weight:800;margin:10px 0 14px;line-height:1.3}
.row{display:flex;gap:8px;align-items:center;font-size:1.15rem;margin:5px 0;font-weight:600}
.lb{display:inline-block;min-width:26px;height:26px;line-height:26px;border-radius:7px;color:#fff;font-size:.85rem;font-weight:700;text-align:center}
.row.o .lb{background:#e5484d}.row.o span{color:var(--on)}
.row.u .lb{background:var(--kun)}.row.u span{color:var(--kun)}
.nav{display:grid;grid-template-columns:1fr 1.3fr 1.3fr 1fr;gap:8px;margin-top:14px}
.nav button{border-radius:16px;padding:13px 4px;font-weight:700}
#again{background:#fff0f0;color:#e03131;border-color:#ffc9c9}
#know{background:var(--ok);color:#fff;border-color:transparent}
.empty{text-align:center;padding:60px 10px;color:var(--muted)}
.empty b{display:block;font-size:2.4rem;margin-bottom:8px}
.foot{text-align:center;font-size:.72rem;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="app">
  <h1>🎴 JLPT N5 ও N4 কানজি ফ্ল্যাশকার্ড</h1>
  <div class="tabs" id="tabs">
    <button class="tab on" data-d="N5">N5</button>
    <button class="tab" data-d="N4">N4</button>
    <button class="tab" data-d="ALL">সব</button>

    <button class="tool" id="rst">↺ রিসেট</button>
    <button class="tool" id="thm">🌓</button>
  </div>
  <div class="bar"><i id="pb"></i></div>
  <div class="stat"><span id="s1"></span><span id="s2"></span></div>
  <div class="stage" id="stage"></div>
  <div class="nav">
    <button id="prev">←</button>
    <button id="again">আবার দেখব</button>
    <button id="know">জানি ✓</button>
    <button id="next">→</button>
  </div>
  <div class="foot">কানজিতে ট্যাপ করলে উত্তর দেখা যাবে · কিবোর্ড: Space = উল্টাও, ← → = আগে/পরে</div>
</div>

const $ = id => document.getElementById(id);
const G = {N5:"linear-gradient(90deg,#ff7a59,#ffb347)", N4:"linear-gradient(90deg,#2f80ed,#7c5cff)"};
const C = {N5:"#d9480f", N4:"#3b5bdb"};
let deck="N5", shuffled=false, onlyUnknown=false, queue=[], idx=0, known=new Set();

try{ known = new Set(JSON.parse(localStorage.getItem("kanji_known")||"[]")); }catch(e){}
function save(){ try{ localStorage.setItem("kanji_known", JSON.stringify([...known])); }catch(e){} }

function build(keepKey){
  let list = DATA.filter(d => deck==="ALL" || d.l===deck);
  const total = list.length;
  if(onlyUnknown) list = list.filter(d => !known.has(d.k));
  if(shuffled){ for(let i=list.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [list[i],list[j]]=[list[j],list[i]]; } }
  queue = list; idx = 0;
  if(keepKey){ const p = queue.findIndex(d=>d.k===keepKey); if(p>=0) idx=p; }
  render(true, total);
}

function stats(total){
  if(total===undefined) total = DATA.filter(d => deck==="ALL" || d.l===deck).length;
  const kn = DATA.filter(d => (deck==="ALL" || d.l===deck) && known.has(d.k)).length;
  $("pb").style.width = (total? kn/total*100 : 0) + "%";
  $("s1").textContent = "✓ জানা: " + kn + " / " + total;
  $("s2").textContent = queue.length ? "কার্ড " + (idx+1) + " / " + queue.length : "";
}

function render(anim, total){
  const st = $("stage");
  if(!queue.length){
    st.innerHTML = '<div class="empty"><b>🎉</b>এই ডেকে দেখানোর মতো কার্ড নেই।<br>"শুধু বাকিগুলো" বন্ধ করো বা রিসেট দাও।</div>';
    stats(total); return;
  }
  const d = queue[idx], g = G[d.l], c = C[d.l];
  st.innerHTML =
   '<div class="card" id="card" style="--g:'+g+';--c:'+c+'">' +
    '<div class="inner">' +
     '<div class="face front"><span class="lvl">'+d.l+'</span><span class="no">'+(known.has(d.k)?"✓ জানা":"")+'</span>' +
       '<div class="k">'+d.k+'</div><div class="hint">👆 ট্যাপ করে উত্তর দেখো</div></div>' +
     '<div class="face back"><span class="lvl">'+d.l+'</span>' +
       '<div class="kk">'+d.k+'</div><div class="mean">'+d.m+'</div>' +
       '<div class="row o"><b class="lb">音</b><span>'+d.o+'</span></div>' +
       '<div class="row u"><b class="lb">訓</b><span>'+d.u+'</span></div>' +
     '</div></div></div>';
  $("card").onclick = () => $("card").classList.toggle("flip");
  stats(total);
}

function go(step, mark){
  if(!queue.length) return;
  const card = $("card");
  const d = queue[idx];
  if(mark==="know"){ known.add(d.k); save(); }
  if(mark==="again"){ known.delete(d.k); save(); }
  const finish = () => {
    if(onlyUnknown && mark==="know"){
      queue.splice(idx,1);
      if(idx>=queue.length) idx=0;
    } else {
      idx = (idx + step + queue.length) % queue.length;
    }
    render(true);
  };
  if(card){ card.classList.add(step>0?"out":"outl"); setTimeout(finish, 240); } else finish();
}

$("next").onclick = () => go(1);
$("prev").onclick = () => go(-1);
$("know").onclick = () => go(1,"know");
$("again").onclick = () => go(1,"again");
$("tabs").onclick = e => {
  const b = e.target.closest(".tab"); if(!b) return;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", x===b));
  deck = b.dataset.d; build();
};
$("shuf").onclick = () => { shuffled=!shuffled; $("shuf").classList.toggle("on",shuffled); build(); };
$("unk").onclick = () => { onlyUnknown=!onlyUnknown; $("unk").classList.toggle("on",onlyUnknown); build(); };
$("rst").onclick = () => {
  if(confirm("এই ডেকের সব 'জানা' চিহ্ন মুছে ফেলবে?")){
    DATA.forEach(d => { if(deck==="ALL" || d.l===deck) known.delete(d.k); });
    save(); build();
  }
};
$("thm").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
document.addEventListener("keydown", e => {
  if(e.code==="Space"||e.key==="Enter"){ e.preventDefault(); const c=$("card"); if(c) c.classList.toggle("flip"); }
  else if(e.key==="ArrowRight") go(1);
  else if(e.key==="ArrowLeft") go(-1);
});
build();
</script>
